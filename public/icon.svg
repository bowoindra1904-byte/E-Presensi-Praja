<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="satpolGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="satpolNavy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="60%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="satpolRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Background Badge Frame -->
  <rect width="512" height="512" rx="110" fill="#030712"/>
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#D97706" stroke-width="2.5" opacity="0.4"/>

  <!-- Main Satpol PP Pentagonal Shield (Perisai Tameng) -->
  <g filter="url(#badgeShadow)">
    <!-- Outer Golden Shield Rim -->
    <polygon points="256,42 448,114 398,420 256,472 114,420 64,114" fill="url(#satpolGold)" stroke="#FEF3C7" stroke-width="4"/>
    
    <!-- Outer Inscription/Border Ring in Deep Gold -->
    <polygon points="256,58 432,124 386,404 256,452 126,404 80,124" fill="#78350F" opacity="0.3"/>
    
    <!-- Inner Navy Field (Latar Biru Satpol PP) -->
    <polygon points="256,66 422,130 380,396 256,444 132,396 90,130" fill="url(#satpolNavy)" stroke="#F59E0B" stroke-width="3"/>

    <!-- Founding Year 1950 at top of shield -->
    <text x="256" y="104" text-anchor="middle" fill="#FDE68A" font-size="20" font-weight="900" font-family="'Plus Jakarta Sans', sans-serif" letter-spacing="3">
      1950
    </text>

    <!-- Padi (Rice Stalk) Left Side (45 grains symbol) -->
    <g fill="#F59E0B" stroke="#78350F" stroke-width="0.8">
      <path d="M 172 140 C 145 200, 140 280, 168 340 C 158 320, 155 240, 172 140 Z" fill="#D97706"/>
      <!-- Grains -->
      <ellipse cx="152" cy="170" rx="9" ry="5" transform="rotate(-30 152 170)"/>
      <ellipse cx="144" cy="195" rx="9" ry="5" transform="rotate(-20 144 195)"/>
      <ellipse cx="140" cy="222" rx="9" ry="5" transform="rotate(-10 140 222)"/>
      <ellipse cx="138" cy="250" rx="9" ry="5" transform="rotate(0 138 250)"/>
      <ellipse cx="142" cy="278" rx="9" ry="5" transform="rotate(15 142 278)"/>
      <ellipse cx="150" cy="305" rx="9" ry="5" transform="rotate(30 150 305)"/>
      <ellipse cx="164" cy="330" rx="9" ry="5" transform="rotate(45 164 330)"/>
    </g>

    <!-- Kapas (Cotton Stalk) Right Side (7 flowers symbol) -->
    <g stroke="#15803D" stroke-width="1.5">
      <path d="M 340 140 C 367 200, 372 280, 344 340 C 354 320, 357 240, 340 140 Z" fill="#15803D" opacity="0.6"/>
      <!-- Cotton Bolls -->
      <g fill="#FFFFFF" stroke="#047857" stroke-width="1.5">
        <circle cx="360" cy="175" r="9"/>
        <circle cx="368" cy="205" r="9"/>
        <circle cx="372" cy="236" r="9"/>
        <circle cx="370" cy="268" r="9"/>
        <circle cx="362" cy="298" r="9"/>
        <circle cx="348" cy="326" r="9"/>
      </g>
    </g>

    <!-- Central Kemudi Kapal (Ship Wheel Steering Helm - 8 Spoke Pegs) -->
    <g id="kemudiKapal">
      <!-- 8 Helm Spokes / Handles -->
      <g stroke="url(#satpolGold)" stroke-width="10" stroke-linecap="round">
        <line x1="256" y1="150" x2="256" y2="310"/>
        <line x1="176" y1="230" x2="336" y2="230"/>
        <line x1="200" y1="174" x2="312" y2="286"/>
        <line x1="312" y1="174" x2="200" y2="286"/>
      </g>
      
      <!-- Helm Peg Knobs -->
      <g fill="#FDE68A" stroke="#92400E" stroke-width="2">
        <circle cx="256" cy="144" r="7"/>
        <circle cx="256" cy="316" r="7"/>
        <circle cx="170" cy="230" r="7"/>
        <circle cx="342" cy="230" r="7"/>
        <circle cx="194" cy="168" r="7"/>
        <circle cx="318" cy="292" r="7"/>
        <circle cx="318" cy="168" r="7"/>
        <circle cx="194" cy="292" r="7"/>
      </g>

      <!-- Outer Wheel Rim -->
      <circle cx="256" cy="230" r="62" fill="none" stroke="url(#satpolGold)" stroke-width="12"/>
      <circle cx="256" cy="230" r="62" fill="none" stroke="#78350F" stroke-width="1.5"/>

      <!-- Inner Wheel Hub -->
      <circle cx="256" cy="230" r="42" fill="url(#satpolRed)" stroke="#FEF3C7" stroke-width="3"/>
      <circle cx="256" cy="230" r="30" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>

      <!-- Bunga Melati Kuning Kusuma Bangsa (Jasmine Flower in Center) -->
      <g fill="#F59E0B" stroke="#92400E" stroke-width="1.5">
        <!-- 5 Petals of Jasmine -->
        <circle cx="256" cy="216" r="7.5"/>
        <circle cx="269" cy="225" r="7.5"/>
        <circle cx="264" cy="241" r="7.5"/>
        <circle cx="248" cy="241" r="7.5"/>
        <circle cx="243" cy="225" r="7.5"/>
        <!-- Center Core -->
        <circle cx="256" cy="230" r="5" fill="#FEF3C7" stroke="#B45309" stroke-width="1"/>
      </g>
    </g>

    <!-- Golden Ribbon Banner at Bottom (Pita Praja Wibawa) -->
    <g id="pitaPrajaWibawa">
      <!-- Ribbon Shadow/Fold -->
      <polygon points="112,398 94,424 136,432 136,404" fill="#92400E"/>
      <polygon points="400,398 418,424 376,432 376,404" fill="#92400E"/>
      
      <!-- Main Curved Ribbon -->
      <path d="M 120 395 Q 256 426 392 395 L 382 432 Q 256 462 130 432 Z" 
            fill="url(#satpolGold)" 
            stroke="#FEF3C7" 
            stroke-width="2.5"/>
      
      <!-- Semboyan PRAJA WIBAWA Text -->
      <text x="256" y="423" 
            text-anchor="middle" 
            fill="#0F172A" 
            font-size="20" 
            font-weight="900" 
            letter-spacing="3" 
            font-family="'Plus Jakarta Sans', sans-serif">
        PRAJA WIBAWA
      </text>
    </g>

    <!-- Bottom Emblem Star/Accent -->
    <polygon points="256,437 259,444 266,444 260,448 262,455 256,451 250,455 252,448 246,444 253,444" fill="#FEF3C7"/>
  </g>
</svg>
